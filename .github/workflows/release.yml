name: Build & Release Debian Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Lint & Build openmediavault-ro-api .deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lint & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev php-cli python3-yaml jq dash

      - name: Validate JSON Datamodels
        run: |
          for f in src/usr/share/openmediavault/datamodels/*.json; do
            echo "Validating $f ..."
            jq empty "$f"
          done

      - name: Validate Workbench YAML Manifests
        run: |
          python3 -c '
          import glob, yaml
          for f in glob.glob("src/usr/share/openmediavault/workbench/**/*.yaml", recursive=True):
              print(f"Validating {f} ...")
              with open(f, "r", encoding="utf-8") as fh:
                  yaml.safe_load(fh)
          '

      - name: Lint Shell & Maintainer Scripts
        run: |
          dash -n DEBIAN/postinst
          dash -n DEBIAN/postrm
          dash -n src/usr/share/openmediavault/confdb/create.d/conf.service.roapi.sh
          bash -n build-deb.sh

      - name: Lint PHP RPC Services
        run: |
          php -l src/usr/share/openmediavault/engined/rpc/roapi.inc
          php -l src/var/www/openmediavault/rpc/roapi.inc

      - name: Lint MCP Server Python Script
        run: |
          python3 -m py_compile mcp/omv-ro-mcp.py

      - name: Build Debian Package (.deb)
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh dist
          cd dist
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmediavault-ro-api-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/SHA256SUMS
