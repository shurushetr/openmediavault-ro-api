name: Build & Release Debian Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Lint & Build openmediavault-ro-api .deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lint & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev php-cli python3-yaml jq dash

      - name: Validate JSON Datamodels
        run: |
          for f in usr/share/openmediavault/datamodels/*.json; do
            echo "Validating $f ..."
            jq empty "$f"
          done

      - name: Validate Workbench YAML Manifests
        run: |
          python3 -c '
          import glob, yaml
          for f in glob.glob("usr/share/openmediavault/workbench/**/*.yaml", recursive=True):
              print(f"Validating {f} ...")
              with open(f, "r", encoding="utf-8") as fh:
                  yaml.safe_load(fh)
          '

      - name: Lint Shell & Maintainer Scripts
        run: |
          bash -n debian/openmediavault-ro-api.postinst
          bash -n debian/openmediavault-ro-api.postrm
          dash -n usr/share/openmediavault/confdb/create.d/conf.service.roapi.sh
          bash -n build-deb.sh
          bash -n scripts/build-apt-repo.sh

      - name: Lint PHP RPC & Endpoint Files
        run: |
          php -l usr/share/openmediavault/engined/rpc/roapi.inc
          php -l usr/share/openmediavault/engined/module/roapi.inc
          php -l usr/share/openmediavault/engined/inc/90roapi-logfile.inc
          php -l var/www/openmediavault/ro-api.php

      - name: Lint MCP Server Python Script
        run: |
          PYTHONPYCACHEPREFIX=/tmp python3 -m py_compile mcp/omv-ro-mcp.py

      - name: Build Debian Package (.deb)
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh dist
          cp -f repo/openmediavault-ro-api.asc dist/
          cp -f repo/openmediavault-ro-api-keyring.gpg dist/
          cp -f mcp/omv-ro-mcp.py dist/
          cd dist
          sha256sum *.deb openmediavault-ro-api.asc openmediavault-ro-api-keyring.gpg omv-ro-mcp.py > SHA256SUMS
          cat SHA256SUMS

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmediavault-ro-api-deb
          path: |
            dist/*.deb
            dist/openmediavault-ro-api.asc
            dist/openmediavault-ro-api-keyring.gpg
            dist/omv-ro-mcp.py
            dist/SHA256SUMS

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "openmediavault-ro-api ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/openmediavault-ro-api.asc
            dist/openmediavault-ro-api-keyring.gpg
            dist/omv-ro-mcp.py
            dist/SHA256SUMS
