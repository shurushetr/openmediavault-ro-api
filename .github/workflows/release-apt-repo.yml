name: Build & Publish Debian Package and APT Repository

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Debian package (.deb)
        run: |
          chmod +x ./build-deb.sh ./scripts/build-apt-repo.sh
          ./build-deb.sh dist

      - name: Build signed APT repository
        run: |
          DEB_FILE="$(ls -1 dist/openmediavault-ro-api_*_all.deb | tail -n 1)"
          ./scripts/build-apt-repo.sh \
            "${DEB_FILE}" \
            dist/apt-repo \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/repo"

      - name: Attach .deb and keyring to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/openmediavault-ro-api_*_all.deb
            dist/apt-repo/openmediavault-ro-api-keyring.gpg
            dist/apt-repo/openmediavault-ro-api.asc
