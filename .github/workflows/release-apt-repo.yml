name: Build & Publish Debian Package and APT Repository

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Debian package (.deb)
        run: |
          chmod +x ./build-deb.sh ./scripts/build-apt-repo.sh
          ./build-deb.sh dist

      - name: Build signed APT repository for GitHub Pages
        run: |
          ./scripts/build-apt-repo.sh \
            dist/openmediavault-ro-api_1.0.0-1_all.deb \
            dist/apt-repo \
            "https://${{ github.repository_owner }}.github.io/openmediavault-ro-api"

      - name: Attach .deb and keyring to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/openmediavault-ro-api_1.0.0-1_all.deb
            dist/apt-repo/openmediavault-ro-api-keyring.gpg
            dist/apt-repo/openmediavault-ro-api.asc

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apt-repo

      - name: Deploy APT repository to GitHub Pages
        uses: actions/deploy-pages@v4
